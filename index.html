<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1C1E22">
  <title>Techgym Academia — Acesso ao Sistema</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body class="login-page">
  <main class="login-wrapper">
    <section class="login-card">
      <div class="login-brand">
        <img src="./assets/logo-techgym.png" alt="Techgym Academia" class="login-logo"
             onerror="this.style.display='none'; document.getElementById('login-logo-fallback').style.display='block';">
        <div id="login-logo-fallback" class="login-logo-fallback" style="display:none;">
          TECH<span>Gym</span>
        </div>
        <p class="login-subtitle">Entre com seu usuário e seu CPF como senha</p>
      </div>

      <div id="auth-error" class="auth-alert" role="alert" style="display: none;"></div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" placeholder="Ex: joao.silva" autocomplete="username" autocapitalize="none" required>
        </div>

        <div class="form-group">
          <label for="password">Senha (CPF)</label>
          <div class="password-field">
            <input type="password" id="password" name="password" inputmode="numeric" placeholder="Somente números ou 000.000.000-00" autocomplete="current-password" required>
            <button type="button" id="toggle-password" class="btn-toggle-pass" aria-label="Mostrar ou ocultar senha">
              Ver
            </button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn-primary btn-login">
          Entrar no Sistema
        </button>
      </form>

      <footer class="login-footer">
        <span>Techgym Academia &bull; Plataforma de Treinos</span>
      </footer>
    </section>
  </main>

  <script>
    const toggleBtn = document.getElementById('toggle-password');
    const passInput = document.getElementById('password');
    if (toggleBtn && passInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        toggleBtn.textContent = isPassword ? 'Ocultar' : 'Ver';
      });
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW:', err));
      });
    }
  </script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
