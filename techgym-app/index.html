<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techgym - Login</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="./css/global.css">
</head>
<body>
  <div class="container" style="max-width: 420px; margin-top: 60px;">
    <div class="card">
      <h1 style="text-align: center; margin-bottom: 8px; color: var(--accent);">TECHGYM</h1>
      <p style="text-align: center; color: var(--text-secondary); margin-bottom: 24px;">
        Acesse sua ficha de treino e frequência
      </p>

      <form id="login-form">
        <label for="email">E-mail de acesso</label>
        <input type="email" id="email" placeholder="seu@email.com" required>

        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••" required>

        <button type="submit" id="btn-login">Entrar</button>
      </form>

      <p id="login-error" style="color: var(--danger); margin-top: 12px; text-align: center; font-size: 14px;"></p>
    </div>
  </div>

  <script type="module" src="./js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
